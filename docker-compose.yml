services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ekms
      POSTGRES_PASSWORD: ekms_dev_password
      POSTGRES_DB: ekms
    ports:
      - "5432:5432"
    volumes:
      - ekms_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ekms -d ekms"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - ekms_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ekms_postgres_data:
  ekms_redis_data:
